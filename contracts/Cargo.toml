[workspace]
resolver = "2"
members = ["aidtrace"]

[workspace.dependencies]
# Pin to the latest soroban-sdk release when you first build (`cargo add soroban-sdk` inside aidtrace/).
soroban-sdk = "23"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
